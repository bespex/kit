name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  themes:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build
      # dist is checked in for the apps: it has to match the sources
      - run: git diff --exit-code -- themes/dist themes/src/data.gen.ts
      - run: npm run check
