<!doctype html>
<html lang="de" data-sx-theme="auto">
  <head>
    <meta charset="utf-8" />
    <title>be spex kit: Themen und Stile</title>
    <link rel="stylesheet" href="../dist/sx.css" />
    <style>
      * { box-sizing: border-box; }
      body { margin: 0; font: 14px/1.45 Inter, "Noto Sans", system-ui, sans-serif; background: var(--sx-bg); color: var(--sx-ink); }
      header { padding: 16px 24px; border-bottom: 1px solid var(--sx-divider); }
      header h1 { margin: 0 0 4px; font-size: 18px; }
      header p { margin: 0; color: var(--sx-ink-2); }
      main { display: grid; grid-template-columns: 460px 1fr; gap: 24px; padding: 24px; align-items: start; }
      .side { position: sticky; top: 16px; }
      .wall { display: grid; grid-template-columns: repeat(auto-fill, minmax(330px, 1fr)); gap: 18px; }
      /* One sample window per theme; theme and style sit together on it */
      .win { border-radius: var(--sx-radius-l); overflow: hidden; border: 1px solid var(--sx-line); background: var(--sx-bg); color: var(--sx-ink); box-shadow: var(--sx-shadow-2); }
      .bar { display: flex; align-items: center; gap: var(--sx-space-3); padding: var(--sx-space-2) var(--sx-space-3); border-bottom: 1px solid var(--sx-divider); }
      .bar b { margin-right: auto; }
      .tab { padding: 2px 6px; color: var(--sx-ink-2); border-radius: var(--sx-radius-s); }
      .tab.on { color: var(--sx-ink); box-shadow: inset 0 -2px 0 var(--sx-accent); }
      .body { display: grid; grid-template-columns: 92px 1fr; }
      .nav { padding: var(--sx-space-2); display: grid; gap: 2px; align-content: start; border-right: 1px solid var(--sx-divider); }
      .nav span { padding: 2px 6px; border-radius: var(--sx-radius-s); color: var(--sx-ink-2); }
      .nav span.sel { background: var(--sx-selection); color: var(--sx-ink); }
      .content { padding: var(--sx-space-3); display: grid; gap: var(--sx-space-2); }
      .card { border: var(--sx-emph-border-w) solid var(--sx-emph-border); border-radius: var(--sx-radius-l); box-shadow: var(--sx-emph-shadow); padding: var(--sx-space-3); }
      .card small { display: block; color: var(--sx-ink-2); }
      .card .row2 { display: flex; gap: 6px; margin-top: 6px; align-items: center; }
      .btn { border: 0; background: var(--sx-accent-fill); color: var(--sx-on-accent); border-radius: var(--sx-radius-m); padding: 3px 10px; font: inherit; }
      .btn.q { background: transparent; color: var(--sx-accent-ink); border: 1px solid var(--sx-line-strong); }
      .chip { font-size: 12px; padding: 0 7px; border-radius: 99px; background: var(--sx-field); border: 1px solid var(--sx-line); }
      .rows { background: var(--sx-surface); border: 1px solid var(--sx-divider); border-radius: var(--sx-radius-m); box-shadow: var(--sx-shadow-1); }
      .r { display: flex; align-items: center; gap: var(--sx-space-2); min-height: var(--sx-row); padding: 0 var(--sx-space-3); border-top: 1px solid var(--sx-divider); }
      .r:first-child { border-top: 0; }
      .r span { flex: 1; }
      .r:hover { background: var(--sx-hover); }
      .dot { width: 8px; height: 8px; border-radius: 50%; }
      mark { background: var(--sx-mark); color: var(--sx-ink); }
      .q3 { color: var(--sx-ink-3); }
      input { font: inherit; color: var(--sx-ink); background: var(--sx-field); border: 1px solid var(--sx-line-strong); border-radius: var(--sx-radius-m); padding: 3px 8px; width: 100%; }
      input::placeholder { color: var(--sx-ink-3); }
      code { font: 12px ui-monospace, monospace; display: block; background: var(--sx-field); padding: 6px 8px; border-radius: var(--sx-radius-m); }
      .foot { display: flex; gap: var(--sx-space-2); padding: var(--sx-space-2) var(--sx-space-3); border-top: 1px solid var(--sx-divider); color: var(--sx-ink-2); font-size: 12px; }
      .foot .sx-area { flex: 1; padding: 1px 6px; border-radius: var(--sx-radius-s); }
      .title { font-size: 12px; color: var(--sx-ink-2); padding: 4px 2px; }
    </style>
  </head>
  <body>
    <header>
      <h1>be spex kit: Farbthemen und Stile</h1>
      <p>Links die Auswahl, wie sie in jeder App erscheint; sie steuert diese Seite. Rechts jedes Thema im gewählten Stil.</p>
    </header>
    <main>
      <div class="side"><sx-appearance id="pick" lang="de"></sx-appearance></div>
      <div class="wall" id="wall"></div>
    </main>
    <script type="module">
      import "../dist/appearance.js";
      import { THEMES, apply, resolveStyle } from "../dist/index.js";

      const sample = (t) => `
        <div class="title">${t.name.de}</div>
        <div class="win" data-theme="${t.id}">
          <div class="bar sx-chrome"><b>Heute</b><span class="tab on">Fokus</span><span class="tab">Ideen</span><span class="tab">Delegiert</span></div>
          <div class="body">
            <div class="nav sx-chrome"><span class="sel">Eingang</span><span>Vorgänge</span><span>Archiv</span></div>
            <div class="content">
              <div class="card sx-emphasis"><strong>Release-Notes prüfen</strong><small>CORE-418 · 2 Links · Checkliste 1/3</small>
                <div class="row2"><button class="btn">Erledigt</button><button class="btn q">Pause</button><span class="chip">@Anna</span></div></div>
              <input placeholder="Schnelleingabe …" />
              <div class="rows">
                <div class="r"><i class="dot" style="background:var(--sx-series-1)"></i><span>Rechnung <mark>beantworten</mark></span><b style="color:var(--sx-warn)">wartet</b></div>
                <div class="r"><i class="dot" style="background:var(--sx-series-2)"></i><span>Webhook-Auth</span><b style="color:var(--sx-ok)">fertig</b></div>
                <div class="r"><i class="dot" style="background:var(--sx-series-3)"></i><span>Build bricht</span><b style="color:var(--sx-danger)">Problem</b></div>
                <div class="r"><i class="dot" style="background:var(--sx-ai)"></i><span>KI schlägt vor</span><span class="q3">vor 2 min</span></div>
              </div>
              <code><span style="color:var(--sx-code-tag)">&lt;task</span> <span style="color:var(--sx-code-attr)">id</span>=<span style="color:var(--sx-code-string)">"418"</span><span style="color:var(--sx-code-tag)">&gt;</span> <span style="color:var(--sx-code-comment)">&lt;!-- Notiz --&gt;</span></code>
            </div>
          </div>
          <div class="foot sx-chrome"><span class="sx-area" data-area="1">Dateien</span><span class="sx-area" data-area="2">Reiter</span><span class="sx-area" data-area="3">KI</span><span class="sx-area" data-area="4">Du</span></div>
        </div>`;

      const wall = document.getElementById("wall");
      wall.innerHTML = THEMES.map((t) => `<div>${sample(t)}</div>`).join("");
      const pick = document.getElementById("pick");
      const params = new URLSearchParams(location.search);
      const show = (value) => {
        apply(value);
        for (const w of wall.querySelectorAll(".win")) apply({ theme: w.dataset.theme, style: value.style }, w);
      };
      pick.value = { theme: params.get("theme") || "auto", style: params.get("style") || "calm" };
      show(pick.value);
      pick.addEventListener("change", (e) => show(e.detail));
    </script>
  </body>
</html>
